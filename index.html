  <title>JetWare AI — AI analytics for data that stays put.</title>

  <meta property="og:title" content="JetWare AI — AI analytics for data that stays put.">
  <meta property="og:description" content="Local-first AI analytics for analysts who work with sensitive data. Natural language querying, automatic insights, large file performance — without your data ever leaving your machine.">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #11192c;
      --blue: #3b9fe8;
      --blue-dim: rgba(59,159,232,0.12);
      --white: #FFFFFF;
      --gray: #8892A0;
    }

    html, body {
      height: 100%;
      background: var(--navy);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,159,232,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,159,232,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(59,159,232,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--blue-dim);
      border: 1px solid rgba(59,159,232,0.25);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--blue);
      letter-spacing: 0.03em;
      margin-bottom: 40px;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .logo-img {
      width: 260px;
      height: 260px;
      margin-bottom: 40px;
      border-radius: 4px;
    }

    .tagline {
      font-size: clamp(16px, 2.2vw, 20px);
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.02em;
      margin-bottom: 40px;
      font-weight: 300;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--blue);
      margin: 0 auto 48px;
      opacity: 0.5;
    }

    .positioning {
      font-size: clamp(14px, 1.8vw, 16px);
      color: rgba(255,255,255,0.55);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 56px;
    }

    .cta-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--blue);
      margin-bottom: 20px;
      font-weight: 500;
    }

    .cta-btn {
      display: inline-block;
      background: var(--blue);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 20px;
    }

    .cta-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .cta-btn:active { transform: translateY(0); }

    .contact-line {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      margin-top: 8px;
    }

    .contact-line a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact-line a:hover { color: var(--blue); }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.03em;
    }
  </style>
</head>
